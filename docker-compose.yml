version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # First run: `docker compose exec ollama ollama pull nomic-embed-text`

  # Single process does everything: serves the API and runs pipeline/edit jobs
  # in the background (see background_jobs.py — no separate worker container,
  # and important: --workers must stay at 1, since background jobs and the
  # in-process concurrency semaphore live in this one process's memory).
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - redis
      - ollama
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    deploy:
      resources:
        limits:
          memory: 4G  # Kokoro TTS + ffmpeg need headroom; this now runs in the API container

volumes:
  redis_data:
  ollama_data:
