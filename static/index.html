<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narrative Video Generator</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <h1>🎬 Narrative Video Generator</h1>
    <nav>
      <button id="nav-jobs" class="nav-btn active">All Jobs</button>
      <button id="nav-new" class="nav-btn">+ New Job</button>
    </nav>
  </header>

  <main>

    <!-- ══════════════ VIEW: Jobs list ══════════════ -->
    <section id="view-jobs" class="view">
      <div class="view-header">
        <h2>Jobs</h2>
        <button id="refresh-jobs-btn" class="ghost">⟳ Refresh</button>
      </div>
      <div id="jobs-list" class="jobs-list">
        <p class="muted">Loading…</p>
      </div>
    </section>

    <!-- ══════════════ VIEW: New job ══════════════ -->
    <section id="view-new" class="view hidden">
      <div class="card">
        <h2>Create a job</h2>
        <form id="create-form">
          <label>
            Prompt
            <textarea id="prompt" rows="3" placeholder="A lighthouse keeper's last night on the job..." required></textarea>
          </label>

          <label>
            Image
            <input type="file" id="image" accept="image/*" required>
          </label>

          <div class="row">
            <label>
              Words per minute
              <input type="number" id="wpm" value="150" min="80" max="250">
            </label>
            <label>
              Video length (min)
              <input type="number" id="video_length_min" value="5" min="1" max="120" step="0.5">
            </label>
            <label>
              Voice
              <input type="text" id="voice_model" value="af_heart">
            </label>
          </div>

          <button type="submit" id="create-btn">Generate</button>
        </form>
      </div>
    </section>

    <!-- ══════════════ VIEW: Job detail ══════════════ -->
    <section id="view-detail" class="view hidden">
      <button id="back-btn" class="ghost">← Back to all jobs</button>

      <div class="card">
        <div class="detail-header">
          <h2>Status: <span id="status-badge" class="badge">-</span></h2>
          <button id="delete-btn" class="danger">🗑 Delete job</button>
        </div>
        <p class="muted">Job ID: <code id="job-id-display"></code></p>
        <p id="prompt-display" class="prompt-display"></p>
        <div id="progress-log" class="progress-log"></div>
        <div id="error-box" class="error-box hidden"></div>
        <button id="retry-btn" class="hidden">🔁 Retry job</button>
      </div>

      <div id="script-card" class="card hidden">
        <h2>Review the script</h2>
        <h3 id="script-title"></h3>
        <div id="segments-list"></div>
        <button id="approve-btn" class="primary">✅ Approve &amp; generate video</button>
      </div>

      <div id="result-card" class="card hidden">
        <h2>Result</h2>
        <video id="result-video" controls></video>
        <audio id="result-audio" controls></audio>
        <div class="links">
          <a id="video-link" href="#" target="_blank">Open video URL</a>
          <a id="audio-link" href="#" target="_blank">Open audio URL</a>
        </div>
      </div>
    </section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
